<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Legacy storage fixture</title>
</head>
<body>
  <img id="tile" src="tile.svg" alt="tile" width="40" height="40">
  <button id="save" type="button">save</button>
  <pre id="out"></pre>
  <script>
    var KEY = 'legacy-best';
    function storageLabel() {
      try {
        return localStorage.getItem(KEY) || 'none';
      } catch (e) {
        return 'blocked';
      }
    }
    function show() {
      document.getElementById('out').textContent = storageLabel();
    }
    document.getElementById('save').onclick = function () {
      try {
        localStorage.setItem(KEY, '42');
      } catch (e) {
        document.getElementById('out').textContent = 'blocked';
        return;
      }
      show();
    };
    show();
  </script>
</body>
</html>
