<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>InZone SDK host harness</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #111; color: #eee; }
    iframe { width: 100%; height: 70vh; border: 0; background: #000; }
    #confirm[hidden] { display: none !important; }
    #confirm {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.65);
      display: flex; align-items: center; justify-content: center;
    }
    .sdk-confirm-dialog { background: #222; padding: 20px; border-radius: 12px; min-width: 280px; }
    #panel { padding: 8px 12px; background: #1b1b1b; font-size: 14px; }
  </style>
</head>
<body>
  <div id="panel">Development host — isolated iframe, fixture catalog, no live charges. <span id="account-label"></span></div>
  <iframe
    id="game"
    title="Game"
    src="/game/index.html"
    sandbox="allow-scripts allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-forms allow-modals allow-downloads allow-orientation-lock allow-presentation"
    referrerPolicy="no-referrer"
    data-inzone-sdk-host="1"
  ></iframe>
  <div class="sdk-confirm-backdrop" id="confirm" hidden>
    <div class="sdk-confirm-dialog" role="dialog" data-testid="purchase-confirm">
      <h2>Confirm purchase</h2>
      <p>This charge uses your InZone coin balance. The game cannot set the price.</p>
      <p>Item: <b data-testid="confirm-title" id="confirm-title"></b></p>
      <p>Price: <b data-testid="confirm-price" id="confirm-price"></b></p>
      <p>Quantity: <b data-testid="confirm-quantity" id="confirm-quantity"></b></p>
      <button type="button" data-testid="confirm-cancel" id="confirm-cancel">Cancel</button>
      <button type="button" data-testid="confirm-buy" id="confirm-buy">Buy</button>
    </div>
  </div>
  <script>
    (function () {
      var iframe = document.getElementById('game');
      var confirmEl = document.getElementById('confirm');
      var confirmResolve = null;
      window.showHostConfirm = function (prompt) {
        document.getElementById('confirm-title').textContent = prompt.title;
        document.getElementById('confirm-price').textContent = prompt.coins + ' ' + prompt.currency;
        document.getElementById('confirm-quantity').textContent = String(prompt.quantity);
        confirmEl.hidden = false;
        return new Promise(function (resolve) { confirmResolve = resolve; });
      };
      function finish(accepted) {
        confirmEl.hidden = true;
        if (confirmResolve) confirmResolve(accepted);
        confirmResolve = null;
      }
      document.getElementById('confirm-buy').onclick = function () { finish(true); };
      document.getElementById('confirm-cancel').onclick = function () { finish(false); };
      window.addEventListener('message', function (event) {
        if (event.source !== iframe.contentWindow) return;
        var data = event.data;
        if (!data || data.channel !== 'inzone-web-sdk' || data.type !== 'req') return;
        var rpc = window.__inzoneHostRpc;
        if (typeof rpc !== 'function') return;
        Promise.resolve(rpc(data)).then(function (response) {
          event.source.postMessage(response, event.origin === 'null' ? '*' : event.origin);
        });
      });

      if (typeof window.__inzoneHostRpc !== 'function') {
        var catalog = {
          gameId: 'sdk-example',
          version: 'fixture-v1',
          offers: [
            { id: 'extra-lives', title: 'Extra lives', kind: 'consumable', coins: 10, quantity: 3 },
            { id: 'golden-badge', title: 'Golden badge', kind: 'durable', coins: 50, quantity: 1 }
          ]
        };
        var KEY = 'inzone.checkout.pending.v1';
        var receipts = {};
        var inventory = {};
        var posts = 0;
        window.__inzoneFailNext = null;
        function slot() { return 'fixture-player\nsdk-example'; }
        function readPending() {
          try { return (JSON.parse(localStorage.getItem(KEY) || '{}')[slot()] || null); } catch (e) { return null; }
        }
        function writePending(row) {
          var map = {};
          try { map = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { map = {}; }
          map[slot()] = row;
          localStorage.setItem(KEY, JSON.stringify(map));
        }
        function clearPending() {
          var map = {};
          try { map = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { map = {}; }
          delete map[slot()];
          localStorage.setItem(KEY, JSON.stringify(map));
        }
        function reply(req, body) {
          return { channel: 'inzone-web-sdk', v: 1, id: req.id, type: 'res', ok: body.ok, result: body.result, error: body.error };
        }
        window.__inzoneHostRpc = async function (req) {
          try {
            if (req.method === 'getConfig') {
              return reply(req, { ok: true, result: { sdkVersion: '2.0.0-preview.1', protocol: 1, gameId: 'sdk-example', fixtureMode: true, isolation: 'opaque-origin-frame', capabilities: ['getConfig','getCatalog','requestPurchase','getInventory','getReceipt','saveState','loadState'], pendingCapabilities: ['postScore','purchaseCoinTier'] } });
            }
            if (req.method === 'getCatalog') return reply(req, { ok: true, result: catalog });
            if (req.method === 'getInventory') {
              var offerId = req.payload && req.payload.offerId;
              return reply(req, { ok: true, result: inventory[offerId] || { gameId: 'sdk-example', offerId: offerId, owned: false, quantity: 0 } });
            }
            if (req.method === 'getReceipt') {
              var rid = req.payload && req.payload.requestId;
              if (!receipts[rid]) return reply(req, { ok: false, error: { code: 'PURCHASE_NOT_FOUND' } });
              clearPending();
              return reply(req, { ok: true, result: receipts[rid] });
            }
            if (req.method === 'saveState') return reply(req, { ok: true, result: { saved: true } });
            if (req.method === 'loadState') return reply(req, { ok: true, result: { version: 0, state: {} } });
            if (req.method !== 'requestPurchase') return reply(req, { ok: false, error: { code: 'INZONE_UNSUPPORTED_CAPABILITY' } });
            var wanted = req.payload && req.payload.offerId;
            var offer = catalog.offers.filter(function (o) { return o.id === wanted; })[0];
            if (!offer) return reply(req, { ok: false, error: { code: 'OFFER_NOT_FOUND' } });
            var pending = readPending();
            if (pending && pending.offerId === wanted && receipts[pending.requestId]) {
              clearPending();
              return reply(req, { ok: true, result: receipts[pending.requestId] });
            }
            var accepted = await window.showHostConfirm({ title: offer.title, coins: offer.coins, quantity: offer.quantity, currency: 'Coin' });
            if (!accepted) return reply(req, { ok: false, error: { code: 'PURCHASE_CANCELLED' } });
            var requestId = (pending && pending.requestId) || ('r_' + Math.random().toString(36).slice(2, 10));
            writePending({ accountId: 'fixture-player', gameId: 'sdk-example', offerId: wanted, catalogVersion: catalog.version, requestId: requestId, status: 'submitted', createdAt: Date.now() });
            posts += 1;
            var fail = window.__inzoneFailNext;
            window.__inzoneFailNext = null;
            var rec = { transactionId: 'tx_' + requestId, gameId: 'sdk-example', offerId: wanted, catalogVersion: catalog.version, coins: offer.coins, currency: 'Coin', newBalance: 0, entitlement: { gameId: 'sdk-example', offerId: wanted, kind: offer.kind, quantity: offer.quantity, transactionId: 'tx_' + requestId } };
            receipts[requestId] = rec;
            inventory[wanted] = { gameId: 'sdk-example', offerId: wanted, owned: true, quantity: (inventory[wanted] ? inventory[wanted].quantity : 0) + offer.quantity, kind: offer.kind, transactionId: rec.transactionId };
            if (fail === 'network') {
              return reply(req, { ok: false, error: { code: 'NETWORK_ERROR', outcomeUnknown: true, requestId: requestId } });
            }
            clearPending();
            return reply(req, { ok: true, result: rec });
          } catch (e) {
            return reply(req, { ok: false, error: { code: 'HOST_INTERNAL_ERROR', message: String(e && e.message || e) } });
          }
        };
        document.getElementById('account-label').textContent = 'fixture-player · posts tracked in-page';
      }
    })();
  </script>
</body>
</html>
